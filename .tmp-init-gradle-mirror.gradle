allprojects {
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            gradlePluginPortal()
        }
    }
    repositories {
        removeAll { it instanceof MavenArtifactRepository && it.url.toString().contains('repo.maven.apache.org') }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://cache-redirector.jetbrains.com/www.jetbrains.com/intellij-repository/releases' }
        maven { url 'https://cache-redirector.jetbrains.com/www.jetbrains.com/intellij-repository/snapshots' }
        maven { url 'https://cache-redirector.jetbrains.com/plugins.jetbrains.com/maven/com/jetbrains/intellij-plugins' }
        maven { url 'https://www.jetbrains.com/intellij-repository/releases' }
        maven { url 'https://www.jetbrains.com/intellij-repository/snapshots' }
        maven { url 'https://plugins.jetbrains.com/maven/com/jetbrains/intellij-plugins' }
        gradlePluginPortal()
    }
}

// 在所有项目评估完成后，覆盖 toolchain 配置（沙箱环境无 JDK 21，用 JDK 25 替代）
// 同时移除所有指向 maven central / plugins.gradle.org 的仓库（沙箱环境会被限速 429）
gradle.afterProject { project ->
    if (project.plugins.hasPlugin('java')) {
        project.java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }
    project.repositories {
        removeAll {
            it instanceof MavenArtifactRepository &&
                (it.url.toString().contains('repo.maven.apache.org') ||
                 it.url.toString().contains('plugins.gradle.org'))
        }
    }
}

settingsEvaluated { settings ->
    settings.pluginManagement {
        repositories {
            removeAll { it instanceof MavenArtifactRepository && it.url.toString().contains('repo.maven.apache.org') }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            gradlePluginPortal()
        }
    }
}

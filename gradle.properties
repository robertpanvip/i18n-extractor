# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=false
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=false
# Force Gradle daemon to use Java 17 (Java 25 causes Kotlin 1.9.24 to fail parsing JavaVersion)
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
# Shorten network timeouts to avoid long hangs on unreachable repos
org.gradle.internal.http.connectionTimeout=15000
org.gradle.internal.http.socketTimeout=15000
org.gradle.internal.repository.max.retries=1

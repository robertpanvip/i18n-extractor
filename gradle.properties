# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Disable config/build cache to avoid stale entries during init troubles
org.gradle.configuration-cache=false
org.gradle.caching=false
# Force Gradle daemon to use Java 17 (Java 25 causes Kotlin 1.x to fail parsing JavaVersion)
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
# Network timeouts: fast fail for unreachable repos
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=30000
org.gradle.internal.repository.max.retries=1
# Daemon JVM: 代理 + IPv4 优先
#   * 代理来自 env HTTP(S)_PROXY=http://127.0.0.1:18080
#   * Java 默认会在"纯 IPv6 网络"环境下优先解析 AAAA 记录，但此容器 IPv6 公网不可达，
#     因此强制 preferIPv4Stack，让 Gradle HTTP 客户端也走代理的 IPv4 localhost。
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true -Xmx2g -XX:MaxMetaspaceSize=512m \
  -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080 \
  -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=18080 \
  -Dhttp.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
# systemProp.* 同样会传给 Gradle JVM 的 network stack（双保险）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
systemProp.java.net.preferIPv4Stack=true

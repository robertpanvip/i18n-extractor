# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# =========== LOCAL TEST ONLY（不提交 PR）===========
# 1) JDK 21：Kotlin 2.4.0 不支持 JDK 25+
org.gradle.java.home=/root/.local/share/mise/installs/java/21.0.2
# 2) JVM 代理：容器里 env HTTP_PROXY JVM 默认**不读**，必须通过 -D 传，否则 wrapper zip / Maven 依赖全部超时。
#    wrapper 下载阶段 JVM 也会读 org.gradle.jvmargs，所以写在这里能两边生效。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=18080 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=18080 -Djava.net.preferIPv4Stack=true
# =========== END LOCAL TEST ONLY ===================

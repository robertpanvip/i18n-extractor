name: Test Kotlin Plugin

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.0.0


      - name: Run tests
        run: gradle test --no-daemon --no-configuration-cache --warn
        continue-on-error: true
        id: test_first

      - name: Retry tests on failure with warning
        if: steps.test_first.outcome == 'failure'
        run: |
          echo "::warning::First test run failed, retrying. This may indicate flaky tests."
          gradle test --no-daemon --no-configuration-cache --warn


      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/

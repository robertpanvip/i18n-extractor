name: Kotlin Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # 安装 JDK
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # ⚠️ Kotlin 2.4.0 / intellij-platform-gradle-plugin 当前组合不支持 JDK 25，
          #    必须锁死 21；与本地 toolchain { languageVersion.set(21) } 对齐。
          java-version: 21


      # 安装 Gradle（自动读取 gradle-wrapper.properties 指定的 9.4.1；不写死 gradle-version）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        # 参考：https://github.com/gradle/actions/tree/main/setup-gradle#use-the-gradle-wrapper


      # 编译 Kotlin（用 wrapper ./gradlew 保证版本与本地一致）
      - name: Build
        run: ./gradlew buildPlugin


      # 获取 tag
      - name: Get tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi


      # 创建 Release 并上传产物
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
